name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: aria2c_admin, POSTGRES_PASSWORD: testpass, POSTGRES_DB: aria2c}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aria2c_admin" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://aria2c_admin:testpass@127.0.0.1:5432/aria2c
      DJANGO_ALLOW_INSECURE_KEY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y aria2
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test -v 1
