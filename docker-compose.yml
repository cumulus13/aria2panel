services:
  web:
    build: .
    image: aria2panel:latest
    command: ["web"]
    env_file: .env
    ports:
      - "${PANEL_PORT:-8000}:8000"
    restart: unless-stopped

  # dispatches queued downloads and applies speed rules, also when no browser is open
  scheduler:
    image: aria2panel:latest
    command: ["scheduler"]
    env_file: .env
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # optional: `docker compose --profile local-aria2 up -d`
  aria2:
    profiles: ["local-aria2"]
    build:
      context: .
      dockerfile: deploy/aria2.Dockerfile
    environment:
      RPC_SECRET: "${ARIA2_RPC_SECRET:?set ARIA2_RPC_SECRET in .env}"
    volumes:
      - "${DOWNLOADS_DIR:-./downloads}:/downloads"
    ports:
      - "6800:6800"
    restart: unless-stopped
  pg:
    image: postgres:15-alpine
    container_name: pg
    hostname: pg
    shm_size: 256m
    command: ["postgres", "-c", "log_min_messages=warning", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hackme
      POSTGRES_DB: postgres
      TZ: Asia/Jakarta
      LANG: en_US.UTF-8
    ports:
    - 5432:5432
    volumes:
    - pg_data2:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - postgres
      interval: 10s
      retries: 5
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    hostname: pgbouncer
    environment:
      - DATABASE_URL=postgres://postgres:hackme@pg:5432/postgres
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
    ports:
      - "6432:6432"
    volumes:
      - /containers/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - /containers/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    tty: true
    depends_on:
      - pg